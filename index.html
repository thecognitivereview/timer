<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Raleway:wght@700;900&family=Lato:wght@400;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Lato', sans-serif;
            background: #000;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #0a1551 0%, #000 70%);
            z-index: -1;
        }
        
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: -1;
        }
        
        h1 {
            font-family: 'Raleway', sans-serif;
            font-weight: 900;
            font-size: 3rem;
            letter-spacing: 0.2em;
            margin-bottom: 2rem;
            text-align: center;
        }
        
        .timer-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }
        
        .time-unit {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .time-value {
            font-family: 'Raleway', sans-serif;
            font-weight: 900;
            font-size: 5rem;
            line-height: 1;
        }
        
        @media (min-width: 768px) {
            .time-value {
                font-size: 8rem;
            }
        }
        
        @media (min-width: 1024px) {
            .time-value {
                font-size: 10rem;
            }
        }
        
        .time-label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 0.5rem;
        }
        
        .separator {
            font-family: 'Raleway', sans-serif;
            font-weight: 900;
            font-size: 4rem;
            color: #ffd900;
            animation: blink 1s infinite;
        }
        
        @media (min-width: 768px) {
            .separator {
                font-size: 6rem;
            }
        }
        
        @media (min-width: 1024px) {
            .separator {
                font-size: 8rem;
            }
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        button {
            font-family: 'Lato', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            padding: 1rem 2rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .btn-primary {
            background: #ffd900;
            color: #000;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #ffe135;
            transform: translateY(-2px);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: transparent;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .btn-mute {
            padding: 1rem;
        }
        
        .btn-mute.muted {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
            color: #ef4444;
        }
        
        .progress-bar {
            width: 100%;
            max-width: 600px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 2rem;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: #ffd900;
            transition: width 1s linear;
        }
        
        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1rem;
            padding: 2rem;
            width: 90%;
            max-width: 400px;
            position: relative;
        }
        
        .modal h2 {
            text-align: center;
            margin-bottom: 1.5rem;
            font-family: 'Raleway', sans-serif;
        }
        
        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            width: 2rem;
            height: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-close:hover {
            color: #fff;
        }
        
        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        
        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .input-group input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-family: 'Raleway', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            text-align: center;
            padding: 0.5rem;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .input-group input:focus {
            border-color: #ffd900;
        }
        
        .input-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 0.5rem;
        }
        
        .modal-btn {
            width: 100%;
            background: #ffd900;
            color: #000;
        }
        
        /* Completion Modal */
        .completion-modal .modal-content {
            text-align: center;
        }
        
        .completion-modal h2 {
            font-size: 4rem;
            color: #ffd900;
            animation: pulse 2s infinite;
            margin-bottom: 2rem;
        }
        
        @keyframes pulse {
            0%, 100% { text-shadow: 0 0 20px rgba(255, 217, 0, 0.5); }
            50% { text-shadow: 0 0 40px rgba(255, 217, 0, 0.8); }
        }
        
        .seconds {
            color: #ffd900;
        }
        
        .seconds.pulse {
            animation: pulse-glow 2s infinite;
        }
        
        @keyframes pulse-glow {
            0%, 100% { text-shadow: 0 0 20px rgba(255, 217, 0, 0.3); }
            50% { text-shadow: 0 0 40px rgba(255, 217, 0, 0.6); }
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="overlay"></div>
    
    <h1>COUNTDOWN</h1>
    
    <div class="timer-display">
        <div class="time-unit">
            <div class="time-value" id="days">00</div>
            <div class="time-label">Days</div>
        </div>
        <div class="separator">:</div>
        <div class="time-unit">
            <div class="time-value" id="hours">00</div>
            <div class="time-label">Hours</div>
        </div>
        <div class="separator">:</div>
        <div class="time-unit">
            <div class="time-value" id="minutes">00</div>
            <div class="time-label">Minutes</div>
        </div>
        <div class="separator">:</div>
        <div class="time-unit">
            <div class="time-value seconds" id="seconds">00</div>
            <div class="time-label">Seconds</div>
        </div>
    </div>
    
    <div class="controls">
        <button class="btn-primary" id="startBtn">Start</button>
        <button class="btn-secondary" id="pauseBtn" style="display:none">Pause</button>
        <button class="btn-secondary" id="resetBtn">Reset</button>
        <button class="btn-secondary" id="setBtn">Set</button>
        <button class="btn-secondary btn-mute" id="muteBtn" title="Toggle sound">
            <span id="muteIcon">🔊</span>
        </button>
    </div>
    
    <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
    
    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <button class="modal-close" id="closeSettings">&times;</button>
            <h2>Set Timer</h2>
            <div class="input-grid">
                <div class="input-group">
                    <input type="number" id="inputDays" min="0" max="365" value="0">
                    <label>Days</label>
                </div>
                <div class="input-group">
                    <input type="number" id="inputHours" min="0" max="23" value="0">
                    <label>Hours</label>
                </div>
                <div class="input-group">
                    <input type="number" id="inputMinutes" min="0" max="59" value="0">
                    <label>Minutes</label>
                </div>
                <div class="input-group">
                    <input type="number" id="inputSeconds" min="0" max="59" value="0">
                    <label>Seconds</label>
                </div>
            </div>
            <button class="btn-primary modal-btn" id="setTimerBtn">Set Timer</button>
        </div>
    </div>
    
    <!-- Completion Modal -->
    <div class="modal-overlay completion-modal" id="completionModal">
        <div class="modal">
            <div class="modal-content">
                <h2>TIME'S UP!</h2>
                <div class="controls">
                    <button class="btn-primary" id="resetCompleteBtn">Reset</button>
                    <button class="btn-secondary" id="newTimerBtn">New Timer</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Timer state
        let timeLeft = { days: 0, hours: 0, minutes: 0, seconds: 0 };
        let initialTime = { days: 0, hours: 0, minutes: 0, seconds: 0 };
        let isRunning = false;
        let isMuted = false;
        let intervalId = null;
        
        // Audio context for beep sound
        let audioContext = null;
        
        // DOM elements
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const setBtn = document.getElementById('setBtn');
        const muteBtn = document.getElementById('muteBtn');
        const muteIcon = document.getElementById('muteIcon');
        const progressFill = document.getElementById('progressFill');
        const settingsModal = document.getElementById('settingsModal');
        const completionModal = document.getElementById('completionModal');
        const closeSettings = document.getElementById('closeSettings');
        const setTimerBtn = document.getElementById('setTimerBtn');
        const resetCompleteBtn = document.getElementById('resetCompleteBtn');
        const newTimerBtn = document.getElementById('newTimerBtn');
        
        // Input elements
        const inputDays = document.getElementById('inputDays');
        const inputHours = document.getElementById('inputHours');
        const inputMinutes = document.getElementById('inputMinutes');
        const inputSeconds = document.getElementById('inputSeconds');
        
        // Initialize audio context
        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        
        // Play beep sound
        function playBeep() {
            if (isMuted || !audioContext) return;
            
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.value = 800;
            oscillator.type = 'square';
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }
        
        // Play alarm (continuous beeping)
        let alarmInterval = null;
        function startAlarm() {
            if (isMuted || !audioContext) return;
            
            playBeep();
            alarmInterval = setInterval(() => {
                if (!isMuted && audioContext) {
                    playBeep();
                }
            }, 600);
        }
        
        function stopAlarm() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
        }
        
        // Format number with leading zero
        function formatNumber(num) {
            return num.toString().padStart(2, '0');
        }
        
        // Update display
        function updateDisplay() {
            daysEl.textContent = formatNumber(timeLeft.days);
            hoursEl.textContent = formatNumber(timeLeft.hours);
            minutesEl.textContent = formatNumber(timeLeft.minutes);
            secondsEl.textContent = formatNumber(timeLeft.seconds);
            
            // Update progress bar
            const totalInitial = initialTime.days * 86400 + initialTime.hours * 3600 + initialTime.minutes * 60 + initialTime.seconds;
            const totalLeft = timeLeft.days * 86400 + timeLeft.hours * 3600 + timeLeft.minutes * 60 + timeLeft.seconds;
            
            if (totalInitial > 0) {
                const progress = ((totalInitial - totalLeft) / totalInitial) * 100;
                progressFill.style.width = progress + '%';
            } else {
                progressFill.style.width = '0%';
            }
            
            // Update start button state
            const totalSeconds = timeLeft.days * 86400 + timeLeft.hours * 3600 + timeLeft.minutes * 60 + timeLeft.seconds;
            startBtn.disabled = totalSeconds === 0;
        }
        
        // Countdown tick
        function tick() {
            const totalSeconds = timeLeft.days * 86400 + timeLeft.hours * 3600 + timeLeft.minutes * 60 + timeLeft.seconds;
            
            if (totalSeconds <= 0) {
                stop();
                completionModal.classList.add('active');
                startAlarm();
                return;
            }
            
            const newTotal = totalSeconds - 1;
            timeLeft.days = Math.floor(newTotal / 86400);
            timeLeft.hours = Math.floor((newTotal % 86400) / 3600);
            timeLeft.minutes = Math.floor((newTotal % 3600) / 60);
            timeLeft.seconds = newTotal % 60;
            
            updateDisplay();
        }
        
        // Start timer
        function start() {
            initAudio();
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            const totalSeconds = timeLeft.days * 86400 + timeLeft.hours * 3600 + timeLeft.minutes * 60 + timeLeft.seconds;
            if (totalSeconds === 0) return;
            
            isRunning = true;
            startBtn.style.display = 'none';
            pauseBtn.style.display = 'inline-block';
            secondsEl.classList.add('pulse');
            
            intervalId = setInterval(tick, 1000);
        }
        
        // Pause timer
        function pause() {
            isRunning = false;
            startBtn.style.display = 'inline-block';
            pauseBtn.style.display = 'none';
            secondsEl.classList.remove('pulse');
            
            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
        }
        
        // Stop timer
        function stop() {
            pause();
            secondsEl.classList.remove('pulse');
        }
        
        // Reset timer
        function reset() {
            stop();
            stopAlarm();
            timeLeft = { ...initialTime };
            updateDisplay();
        }
        
        // Toggle mute
        function toggleMute() {
            isMuted = !isMuted;
            muteIcon.textContent = isMuted ? '🔇' : '🔊';
            muteBtn.classList.toggle('muted', isMuted);
            
            if (isMuted) {
                stopAlarm();
            }
        }
        
        // Open settings modal
        function openSettings() {
            stop();
            stopAlarm();
            inputDays.value = initialTime.days;
            inputHours.value = initialTime.hours;
            inputMinutes.value = initialTime.minutes;
            inputSeconds.value = initialTime.seconds;
            settingsModal.classList.add('active');
        }
        
        // Close settings modal
        function closeSettingsModal() {
            settingsModal.classList.remove('active');
        }
        
        // Set timer from inputs
        function setTimer() {
            const days = Math.min(365, Math.max(0, parseInt(inputDays.value) || 0));
            const hours = Math.min(23, Math.max(0, parseInt(inputHours.value) || 0));
            const minutes = Math.min(59, Math.max(0, parseInt(inputMinutes.value) || 0));
            const seconds = Math.min(59, Math.max(0, parseInt(inputSeconds.value) || 0));
            
            initialTime = { days, hours, minutes, seconds };
            timeLeft = { days, hours, minutes, seconds };
            
            updateDisplay();
            closeSettingsModal();
        }
        
        // Event listeners
        startBtn.addEventListener('click', start);
        pauseBtn.addEventListener('click', pause);
        resetBtn.addEventListener('click', reset);
        setBtn.addEventListener('click', openSettings);
        muteBtn.addEventListener('click', toggleMute);
        closeSettings.addEventListener('click', closeSettingsModal);
        setTimerBtn.addEventListener('click', setTimer);
        
        resetCompleteBtn.addEventListener('click', () => {
            reset();
            completionModal.classList.remove('active');
        });
        
        newTimerBtn.addEventListener('click', () => {
            completionModal.classList.remove('active');
            openSettings();
        });
        
        // Close modals on backdrop click
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) closeSettingsModal();
        });
        
        completionModal.addEventListener('click', (e) => {
            if (e.target === completionModal) {
                completionModal.classList.remove('active');
            }
        });
        
        // Input validation
        [inputDays, inputHours, inputMinutes, inputSeconds].forEach(input => {
            input.addEventListener('focus', () => input.select());
        });
        
        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
